services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildmart_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - shop_net
    profiles: ["cloud", "local"]

  postgres:
    image: postgres:15-alpine
    container_name: buildmart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-shop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-shop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shop_net
    profiles: ["local"]

  redis:
    image: redis:7-alpine
    container_name: buildmart_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shop_net
    profiles: ["local"]

volumes:
  postgres_data:
  redis_data:

networks:
  shop_net:
    driver: bridge